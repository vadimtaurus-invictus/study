<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Простий Калькулятор</title>
    <link rel="stylesheet" href="calculator.css" />
  </head>
  <body>
    <div class="calculator-card">
      <h2>Калькулятор</h2>

      <div class="input-group">
        <label for="num1">Перше число:</label>
        <input type="number" id="num1" placeholder="Введіть число" step="any" />
      </div>

      <div class="input-group">
        <label for="operator">Операція:</label>
        <select id="operator">
          <option value="+">Додавання (+)</option>
          <option value="-">Віднімання (-)</option>
          <option value="*">Множення (*)</option>
          <option value="/">Ділення (/)</option>
        </select>
      </div>

      <div class="input-group">
        <label for="num2">Друге число:</label>
        <input type="number" id="num2" placeholder="Введіть число" step="any" />
      </div>

      <button onclick="calculate()">Обчислити</button>

      <div class="result-box" id="result">Результат</div>
    </div>

    <script src="calculator.js"></script>
  </body>
</html>
