<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Макет 4</title>
    <!-- Підключення Bootstrap 5 CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <style>
      /* Стилі для відтворення кольорів та відступів з макету */
      body {
        background-color: #cbebfb;
        font-family: Arial, sans-serif;
      }

      .layout-container {
        max-width: 900px;
        margin: 20px auto;
        padding: 20px;
      }

      .block {
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.5rem;
        border-radius: 4px;
        text-align: center;
      }

      /* Кольори блоків */
      .bg-header,
      .bg-footer {
        background-color: #00bfa5;
        height: 60px;
      }

      .bg-nav {
        background-color: #2e7d32;
        height: 50px;
      }

      .bg-aside {
        background-color: #66bb6a;
        min-height: 320px;
        height: 100%;
      }

      .bg-content {
        background-color: #00838f;
        height: 150px;
      }

      .bg-section {
        background-color: #0277bd;
        height: 150px;
      }
    </style>
  </head>
  <body>
    <div class="container layout-container">
      <h2 class="fw-bold mb-3">Макет 4</h2>

      <!-- Header -->
      <div class="row mb-3">
        <div class="col-12">
          <header class="block bg-header">Header</header>
        </div>
      </div>

      <!-- Navigation -->
      <div class="row mb-3">
        <div class="col-12">
          <nav class="block bg-nav">Navigation</nav>
        </div>
      </div>

      <!-- Main Content Area (Aside + Content & Section) -->
      <div class="row mb-3 g-3">
        <!-- Aside (Ліва колонка) -->
        <div class="col-md-4">
          <aside class="block bg-aside">Aside</aside>
        </div>

        <!-- Права колонка з Content і Section -->
        <div class="col-md-8">
          <div class="row g-3">
            <div class="col-12">
              <main class="block bg-content">Content</main>
            </div>
            <div class="col-12">
              <section class="block bg-section">Section</section>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="row">
        <div class="col-12">
          <footer class="block bg-footer">Footer</footer>
        </div>
      </div>
    </div>
  </body>
</html>
