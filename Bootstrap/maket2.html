<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Макет 2 - Bootstrap</title>
    <!-- Bootstrap 5 CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <style>
      /* Стилі для відтворення кольорів та висоти як на зображенні */
      body {
        background-color: #f8f9fa;
      }

      .bg-header {
        background-color: #3b82f6;
      }

      .bg-sidebar {
        background-color: #22c55e;
      }

      .bg-main {
        background-color: #a855f7;
      }

      .bg-related,
      .bg-cta {
        background-color: #6366f1;
      }

      .bg-footer {
        background-color: #64748b;
      }

      /* Задаємо мінімальну висоту блоків для збереження пропорцій */
      .block-header {
        height: 120px;
      }
      .block-sidebar {
        height: 100%;
        min-height: 320px;
      }
      .block-main {
        height: 170px;
      }
      .block-sub {
        height: 135px;
      }
      .block-footer {
        height: 110px;
      }
    </style>
  </head>
  <body>
    <div class="container my-4 p-4 bg-light shadow-sm rounded-3">
      <h2 class="fw-bold mb-3">Макет 2</h2>

      <!-- Header -->
      <div class="row mb-3">
        <div class="col-12">
          <div
            class="bg-header text-white p-3 rounded-3 block-header fw-semibold"
          >
            Header with Logo & Nav
          </div>
        </div>
      </div>

      <!-- Middle Content Area (Sidebar + Main/Sub Content) -->
      <div class="row mb-3 g-3">
        <!-- Sidebar Navigation -->
        <div class="col-md-4">
          <div
            class="bg-sidebar text-white p-3 rounded-3 block-sidebar fw-semibold"
          >
            Sidebar Navigation
          </div>
        </div>

        <!-- Right Column Grid -->
        <div class="col-md-8">
          <div class="row g-3">
            <!-- Main Content Area -->
            <div class="col-12">
              <div
                class="bg-main text-white p-3 rounded-3 block-main fw-semibold"
              >
                Main Content Area
              </div>
            </div>
            <!-- Related Content -->
            <div class="col-md-6">
              <div
                class="bg-related text-white p-3 rounded-3 block-sub fw-semibold"
              >
                Related Content
              </div>
            </div>
            <!-- Call to Action -->
            <div class="col-md-6">
              <div
                class="bg-cta text-white p-3 rounded-3 block-sub fw-semibold"
              >
                Call to Action
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="row">
        <div class="col-12">
          <div
            class="bg-footer text-white p-3 rounded-3 block-footer fw-semibold"
          >
            Footer Content
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
