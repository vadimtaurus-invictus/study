<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Форматування тексту</title>
    <style>
      body {
        text-align: center;
        background-color: bisque;
      }
      body {
      }
      p {
        color: #0b0b41;
        border: 1px solid black;
      }
      .italic {
        font-style: italic;
      }
      .bold {
        font-weight: bold;
      }
      .underline {
        text-decoration: underline;
      }
      /* висота рядка - не розмір шрифту */
      .high_row {
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <p class="high_row">
      <i>Курсив</i> <br />
      <em>Курсив em</em> <br />
      <u>Підкресленний текст</u> <br />
      <b>Жирний</b> <br />
      <strong>Жирний текст strong</strong>
    </p>
    <p class="italic">CSS:Курсив</p>
    <p class="bold">CSS:Жирний текст</p>
    <p class="underline">CSS:Підкресленний текст</p>
  </body>
</html>
