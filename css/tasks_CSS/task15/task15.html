<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>картка-товару(розетка)</title>
    <link rel="stylesheet" href="task15.css" />
  </head>
  <body>
    <div class="goods">
      <div class="wish"><button>💛</button></div>
      <img
        src="https://content1.rozetka.com.ua/goods/images/big/656246037.jpg"
        alt="фото товару"
      />
      <div class="name">
        <a href="#">Кавомашина Beko CEG7348X HomeDirect</a>
      </div>
      <div class="rate">
        <div>⭐⭐⭐⭐⭐</div>
        <div>💬</div>
        <div class="count">45</div>
      </div>
      <div class="buy">
        <div class="price">
          <div class="old-price">32&nbsp;999&nbsp;₴</div>
          <div class="current-price">19&nbsp;999</div>
        </div>
        <div class="cart">
          <button>
            <img
              src="../content_for_CSS/cart_img50x50.jpg"
              alt="кнопка-кошик"
            />
          </button>
        </div>
      </div>

      <div class="delivery">
        <div class="free-del"><a href="#">Безкоштовна доставка</a></div>
        <div>
          <img src="../content_for_CSS/smart_logo.png" alt="smart_logo" />
        </div>
      </div>
    </div>
  </body>
</html>
