<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Зображення_2</title>
  </head>
  <body>
    <!-- зпдання ширини у відсотках дозволяє підганяти картинку під розмір вікна при змінах його розміру -->
    <img src="images/cat-2.jpg" alt="коти в окулярах" width="100%" />
    <h3>Для зображень по горизонталі задаємо висоту без ширини</h3>
    <p>
      <!--Для задання висоти використовуємо переважно піселі, або vh - висота відносно екрану, однакова висота краще виглядає по горизонталі -->
      <img src="images/cat-1.jpg" height="150px" alt="кошеня на ліжку" />
      <img src="images/cat-2.jpg" height="150px" alt="коти в окулярах" />
      <img src="images/cat-3.jpg" height="150px" alt="кіт з клавіатурою" />
    </p>
    <h3>Для зображень по вертикалі задаємо ширину без висоти</h3>
    <p>
      <!-- ширину переважно задаємо у відсотках або vw - ширина відносно екрану -->
      <img src="images/cat-1.jpg" width="55%" alt="кошеня на ліжку" />
      <img src="images/cat-2.jpg" width="55%" alt="коти в окулярах" />
      <img src="images/cat-3.jpg" width="55%" alt="кіт з клавіатурою" />
    </p>

    <h3>Зображення не є блочним елементом</h3>

    <p>
      <!-- варіант зображення в одному абзаці з текстом -->
      Тут поруч буде зображення
      <img
        src="../day6/small-red-cat.jpg"
        width="5%"
        alt="маленьке руде кошеня"
      />
      Ось вже було.
    </p>
    <!-- варіант з розбивкою по абзацам р -->
    <p>Тут поруч буде зображення</p>
    <p>
      <img
        src="../day6/small-red-cat.jpg"
        width="5%"
        alt="маленьке руде кошеня"
      />
    </p>
    <p>Ось вже було.</p>
  </body>
</html>
