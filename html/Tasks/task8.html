<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocumentВхід в обліковий запис</title>
  </head>

  <body>
    <h1>Вхід до облікового запису</h1>
    <form action="#">
      <p>
        <label for="mail">Ваша пошта:</label>
        <input
          type="text"
          name="client_mail"
          placeholder="example@mail.com"
          required
        />
      </p>

      <p>
        <label for="password">Пароль:</label>
        <input
          type="password"
          name="client_password"
          placeholder="password"
          required
          minlength="6"
        />
      </p>

      <p>
        <input type="checkbox" name="client_save" id="save" />
        <label for="save">Запам'ятати мене</label>
      </p>
      <p><button type="submit">Увійти</button></p>
    </form>
    <p>
      <a href="#">Забули пароль?</a>
    </p>
  </body>
</html>
